name: desktop-release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build-mac:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @deepseek-ai/dsh-desktop run build
      # osx-sign's walkAsync recurses with Promise.all over the whole .app, so
      # every file is opened concurrently (~12k after pruning) and the burst
      # exceeds the runner's stock kern.maxfilesperproc (~10k) no matter how
      # high the soft limit is raised. Lift the kernel cap (passwordless sudo
      # on GitHub runners); signIgnore narrows what gets signed, not walked.
      - run: sudo sysctl -w kern.maxfilesperproc=65536
      - name: dist (signed when secrets present, otherwise Plan-1 unsigned)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The raised kernel cap is the new hard fd limit; lift the soft limit
        # to it before electron-builder walks the staged tree.
        run: ulimit -n "$(ulimit -Hn)" && pnpm --filter @deepseek-ai/dsh-desktop run dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            apps/desktop/dist-build/*.dmg
            apps/desktop/dist-build/*.zip
