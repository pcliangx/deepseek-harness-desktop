name: desktop-release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build-mac:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @deepseek-ai/dsh-desktop run build
      - name: dist (signed when secrets present, otherwise Plan-1 unsigned)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The macOS runner's default 256 fd ceiling cannot sign the staged CLI
        # tree (EMFILE); 4096 still exhausts ~60% in — raise soft to the hard
        # max before electron-builder walks the tens of thousands of files.
        run: ulimit -n "$(ulimit -Hn)" && pnpm --filter @deepseek-ai/dsh-desktop run dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            apps/desktop/dist-build/*.dmg
            apps/desktop/dist-build/*.zip
